name: code-review

on:
  push:
    path: 
      - ".github/workflows/*"
  workflow_dispatch: #manual

jobs:
  cli:
    name: command-lines
    runs-on: ubuntu-latest
    env: 
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - run: gh --version
      - run: gh auth status
      - run: gh workflow list
      - run: gh issue list
      - run: gh repo list
